<!DOCTYPE html>
<!--
    login.html - Página de login do sistema Consultar CNPJ
    ───────────────────────────────────────────────────────
    Dependências:
      - static/css/theme.css   → identidade visual (dark/light)
      - Bootstrap 5.3          → tooltips (apenas para o ícone de dica)
      - Bootstrap Icons 1.10   → ícone bi-info-circle e bi-sun/bi-moon

    Tema:
      O tema padrão é "dark". O usuário pode alternar com o botão
      no canto superior direito. A preferência é salva no localStorage
      (chave: "tema-afa") e compartilhada com o index.html.
-->
<html lang="pt-br" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexBiz - Consultas Empresariais</title>
    <meta name="description" content="Entre para consultar CNPJ, tributação e marcas.">

    <!-- Metadados exibidos ao compartilhar o link (WhatsApp, Slack, Discord, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="NexBiz - Consultas Empresariais">
    <meta property="og:description" content="Entre para consultar CNPJ, tributação e marcas.">
    <meta property="og:image" content="{{ url_for('static', filename='images/logo.png', _external=True) }}">
    <meta property="og:url" content="{{ request.url_root }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="NexBiz - Consultas Empresariais">
    <meta name="twitter:description" content="Entre para consultar CNPJ, tributação e marcas.">
    <meta name="twitter:image" content="{{ url_for('static', filename='images/logo.png', _external=True) }}">

    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}" type="image/png">
    <!-- Ícone usado pelo iOS ao "Adicionar à Tela de Início" -->
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">

    <!-- Google Fonts: Inter (pesos 400 e 500) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <!-- Bootstrap Icons (usados no tooltip e no botão de tema) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <!-- ► Identidade visual do projeto - todas as cores e estilos ficam aqui -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">

    <!-- Bootstrap CSS - carregado DEPOIS do theme.css para que nossos !important vençam -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!--
        Script inline de tema - DEVE ficar aqui no <head>, antes de qualquer CSS.
        Lê a preferência salva no localStorage e aplica o data-theme no <html>
        ANTES da página ser pintada, evitando o flash branco inicial.
    -->
    <script nonce="{{ csp_nonce }}">
        (function() {
            var tema = localStorage.getItem('tema-afa') || 'dark';
            document.documentElement.setAttribute('data-theme', tema);
        })();
    </script>

    <style>
        /*
            Estilos específicos desta página que não fazem sentido
            no tema global (posicionamento do toggle, por ex.).
        */

        /*
            Override explícito do body - necessário porque o Bootstrap redefine
            background-color do body. Espelha as variáveis do theme.css.
        */
        [data-theme="dark"] body {
            background-color: #0A0F1E !important;
            color: #E8EEF7 !important;
        }
        [data-theme="light"] body {
            background-color: #F7F9FC !important;
            color: #111827 !important;
        }

        /* Mesma técnica do login do NexGarage: um único container
           position:relative + min-height que centraliza o card (flex +
           align/justify-content:center), com o rodapé ancorado via
           position:absolute no rodapé dele - em vez de "body em coluna
           com flex:1 + rodapé", que dependia de dois elementos
           dividindo espaço via flex-grow. */
        html {
            /* Trava o pan/scroll no elemento raiz também, não só no
               body - se o body (filho) ficar maior que o html (pai)
               em algum instante, sem isso o html ainda deixa arrastar
               a página pros lados/baixo. */
            overflow: hidden;
        }
        body {
            position: relative;
            /* O theme.css (global, todas as páginas) define "height"
               (não min-height) no body de propósito, pro layout em
               coluna com flex-grow do index.html/admin funcionar no
               WebKit - ver comentário lá. Só que "height" e
               "min-height" convivem: se height calcular um valor
               maior, é ele quem vence, mesmo com um min-height menor
               definido depois. Por isso o min-height:100dvh abaixo não
               tinha efeito nenhum aqui - o height:100vh global (812px
               no aparelho testado) continuava sendo o valor real.
               "height:auto" cancela isso só nesta página, deixando o
               min-height ser quem manda (mesmo padrão do NexGarage,
               que nunca define height no body, só min-height). */
            height: auto;
            /* min-height:100vh como fallback (navegadores sem suporte
               a dvh) + min-height:100dvh por cima, que vence quando
               suportado. 100vh sozinho, medido no aparelho real, deu
               812px num estado em que só 660px estavam de fato
               visíveis (barras do Safari ainda na tela) - ou seja,
               100vh aqui usa a altura "grande" (sem as barras), não a
               visível agora, e centralizava o card numa caixa 152px
               maior que a tela, empurrando tudo pra cima do centro
               real. 100dvh acompanha a altura visível de verdade. */
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            /* overflow:hidden nos dois eixos - exatamente como o
               container equivalente do NexGarage (`overflow-hidden`
               no className). Foi conferindo o código-fonte real deles
               que vi isso, em vez de ficar adivinhando pelo comportamento. */
            overflow: hidden;
        }

        /* Botão de tema - position:absolute (não fixed), igual ao
           ThemeToggle do NexGarage. Com fixed, o botão "flutuava" fora
           de sincronia com o conteúdo durante pinch-zoom no Safari
           iOS; absolute o mantém ancorado ao container (body), que é
           o comportamento correto aqui já que a página não rola. */
        .login-tema-toggle {
            position: absolute;
            top: 20px;
            right: 24px;
            z-index: 20;
        }

        /* Linha com o card à esquerda e o radar à direita */
        .login-split {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 72px;
        }

        /* Ancorado no fundo do body (position:relative) - ver comentário
           na regra de "body" acima. */
        .login-rodape {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .login-card-wrapper {
            width: 100%;
            max-width: 400px;
            flex-shrink: 0;
        }

        /* Espaçamento entre campos do formulário */
        .campo-grupo {
            margin-bottom: 16px;
        }

        /* ─────────────────────────────────────────────────────────
           RADAR ANIMADO - decoração ao lado do card de login
           ─────────────────────────────────────────────────────────
           Feito só com CSS (sem imagem): anéis concêntricos fixos,
           uma varredura giratória (conic-gradient) e alguns pontos
           que piscam como "achados" da busca. Usa as variáveis de
           tema (--cor-acento etc.) para se adaptar a claro/escuro.
           ───────────────────────────────────────────────────────── */
        .login-radar-wrapper {
            position: relative;
            width: 380px;
            height: 380px;
            flex-shrink: 0;
        }

        .login-radar-wrapper::before {
            /* Glow suave atrás do radar */
            content: '';
            position: absolute;
            inset: -40px;
            background: radial-gradient(circle, var(--cor-acento-fundo) 0%, transparent 70%);
            border-radius: 50%;
        }

        .radar {
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }

        .radar-anel {
            position: absolute;
            top: 50%;
            left: 50%;
            border: 1px solid var(--cor-borda-forte);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.45;
        }
        .radar-anel-1 { width: 100%; height: 100%; }
        .radar-anel-2 { width: 72%; height: 72%; }
        .radar-anel-3 { width: 44%; height: 44%; }
        .radar-anel-4 { width: 18%; height: 18%; opacity: 0.7; }

        /* Linhas cruzadas, como um retículo de mira */
        .radar-eixo {
            position: absolute;
            top: 50%;
            left: 50%;
            background: var(--cor-borda);
            transform: translate(-50%, -50%);
        }
        .radar-eixo-h { width: 100%; height: 1px; }
        .radar-eixo-v { width: 1px; height: 100%; }

        .radar-varredura {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, transparent 265deg, var(--cor-acento) 300deg, transparent 340deg);
            animation: radar-girar 4.5s linear infinite;
        }

        @keyframes radar-girar {
            to { transform: rotate(360deg); }
        }

        .radar-nucleo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: var(--cor-acento);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 18px 4px var(--cor-acento);
        }

        .radar-ponto {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--cor-acento);
            transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0.4);
            opacity: 0;
            animation: radar-pulso 3.6s ease-in-out infinite;
            animation-delay: var(--atraso, 0s);
        }

        @keyframes radar-pulso {
            0%, 12% {
                opacity: 0;
                transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0.4);
            }
            20%, 38% {
                opacity: 1;
                transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1);
            }
            55%, 100% {
                opacity: 0;
                transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(0.4);
            }
        }

        /* Some com o radar e volta pro layout de uma coluna em telas menores */
        @media (max-width: 991px) {
            .login-radar-wrapper {
                display: none;
            }
            .login-split {
                gap: 0;
            }
        }
    </style>
</head>

<body>

    <!-- Botão de alternância de tema (dark ↔ light) - fixo no canto da tela -->
    <div class="login-tema-toggle">
        <button id="btn-tema" aria-label="Alternar tema">
            <!-- O ícone e o texto são trocados pelo JS abaixo -->
            <i class="bi bi-sun" id="icone-tema"></i>
            <span id="texto-tema">Claro</span>
        </button>
    </div>

    <!-- ══════════════════════════════════════════════════════════
         CONTEÚDO CENTRAL: card de login à esquerda + radar à direita
         Centralizado direto pelo <body> (position:relative + flex) -
         ver comentário na regra de "body" no <style> acima.
         ══════════════════════════════════════════════════════════ -->
    <div class="login-split">

    <div class="login-card-wrapper">

        <!-- ══════════════════════════════════════════════════════
             CARD DE LOGIN
             ══════════════════════════════════════════════════════ -->
        <div class="login-card">

            <!-- Marca: logo NexBiz + nome da ferramenta -->
            <div class="login-marca">

                <!-- Logo NexBiz -->
                <img
                    src="{{ url_for('static', filename='images/logo.png') }}"
                    alt="Nex Biz"
                    class="login-logo-img"
                >

                <!-- Nome da ferramenta com ponto ciano como acento -->
                <span class="login-marca-nome">
                    NexBiz<span class="login-marca-ponto">.</span>
                </span>
                <span class="login-marca-subtitulo">Entre para consultar CNPJ, tributação e marcas</span>
            </div>

            <!-- Mensagem de erro (exibida pelo Flask quando login falha) -->
            {% if erro %}
                <div class="msg-base msg-erro" role="alert">
                    <i class="bi bi-exclamation-circle me-1"></i>
                    {{ erro }}
                </div>
            {% endif %}

            <!-- Formulário de login -->
            <form method="POST" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <!-- Campo: E-mail -->
                <div class="campo-grupo">
                    <label for="email" class="campo-label">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="email@empresa.com"
                        autocomplete="username"
                        required
                    >
                </div>

                <!-- Campo: Senha -->
                <div class="campo-grupo">
                    <label for="senha" class="campo-label">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <!-- CAPTCHA (Cloudflare Turnstile, invisível): roda em segundo
                     plano e injeta o token no campo oculto "cf-turnstile-response"
                     deste form. O botão só libera depois que o token chega. -->
                <div
                    class="cf-turnstile"
                    data-sitekey="{{ turnstile_site_key }}"
                    data-language="pt-br"
                    data-callback="captchaOk"
                    data-expired-callback="captchaExpirado"
                    data-error-callback="captchaErro"
                ></div>

                <div id="msg-captcha" class="msg-base msg-erro" role="alert" hidden>
                    <i class="bi bi-exclamation-circle me-1"></i>
                    Não foi possível verificar seu navegador. Recarregue a página e tente novamente.
                </div>

                <!-- Botão de submit -->
                <button type="submit" id="btn-entrar" class="btn-giro w-100" disabled>
                    <span class="btn-giro-superficie">
                        <span id="btn-entrar-texto">Verificando...</span>
                        <svg class="btn-giro-seta" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 12h14" />
                            <path d="m12 5 7 7-7 7" />
                        </svg>
                    </span>
                </button>

            </form>
        </div>
        <!-- /.login-card -->

    </div>
    <!-- /.login-card-wrapper -->

    <!-- ══════════════════════════════════════════════════════════
         RADAR DECORATIVO - some em telas menores (ver media query)
         ══════════════════════════════════════════════════════════ -->
    <div class="login-radar-wrapper" aria-hidden="true">
        <div class="radar">
            <div class="radar-eixo radar-eixo-h"></div>
            <div class="radar-eixo radar-eixo-v"></div>
            <div class="radar-anel radar-anel-1"></div>
            <div class="radar-anel radar-anel-2"></div>
            <div class="radar-anel radar-anel-3"></div>
            <div class="radar-anel radar-anel-4"></div>
            <div class="radar-varredura"></div>
            <div class="radar-nucleo"></div>
            <span class="radar-ponto" style="--x: 70px; --y: -95px; --atraso: 0s;"></span>
            <span class="radar-ponto" style="--x: -110px; --y: 30px; --atraso: 1.2s;"></span>
            <span class="radar-ponto" style="--x: 40px; --y: 110px; --atraso: 2.4s;"></span>
            <span class="radar-ponto" style="--x: -60px; --y: -60px; --atraso: 3.1s;"></span>
        </div>
    </div>

    </div>
    <!-- /.login-split -->

    <!-- ══════════════════════════════════════════════════════════
         RODAPÉ - ancorado embaixo do <body> via position:absolute
         (mesma técnica do NexGarage), não disputa espaço em flex
         com o conteúdo centralizado acima.
         ══════════════════════════════════════════════════════════ -->
    <footer class="login-rodape py-2">
        <div class="container-fluid">
            <div class="row">
                <div class="col text-center">
                    <span class="rodape-copy">
                        &copy; 2026 <a href="https://www.abdalanexus.com/" target="_blank" rel="noopener">Abdala Nexus</a>
                    </span>
                </div>
            </div>
        </div>
    </footer>


    <!-- ══════════════════════════════════════════════════════════
         SCRIPTS
         ══════════════════════════════════════════════════════════ -->

    <!-- Bootstrap JS - necessário para o Tooltip do campo Usuário -->
    <script nonce="{{ csp_nonce }}" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script nonce="{{ csp_nonce }}">
        /* ─────────────────────────────────────────────────────────
           CAPTCHA (Cloudflare Turnstile)
           ─────────────────────────────────────────────────────────
           Callbacks chamados pelo widget. Precisam ser globais e
           existir antes do api.js carregar (por isso vêm antes dele).
           ───────────────────────────────────────────────────────── */
        function liberarEntrar(liberado) {
            document.getElementById('btn-entrar').disabled = !liberado;
            document.getElementById('btn-entrar-texto').textContent = liberado ? 'Entrar' : 'Verificando...';
        }
        function captchaOk() {
            document.getElementById('msg-captcha').hidden = true;
            liberarEntrar(true);
        }
        function captchaExpirado() {
            // O widget renova o token sozinho; só trava o botão até chegar outro.
            liberarEntrar(false);
        }
        function captchaErro() {
            liberarEntrar(false);
            document.getElementById('msg-captcha').hidden = false;
        }
    </script>
    <script nonce="{{ csp_nonce }}" src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>

    <script nonce="{{ csp_nonce }}">
        /* ─────────────────────────────────────────────────────────
           TOGGLE DE TEMA (dark / light)
           ─────────────────────────────────────────────────────────
           Lê a preferência do localStorage na chave "tema-afa".
           Se não houver preferência salva, aplica "dark" (padrão).
           Ao clicar no botão, alterna o data-theme do <html> e
           salva a nova preferência.
           ───────────────────────────────────────────────────────── */
        (function () {
            const CHAVE_STORAGE = 'tema-afa';   // chave compartilhada com index.html
            const html          = document.documentElement;
            const btnTema       = document.getElementById('btn-tema');
            const iconeTema     = document.getElementById('icone-tema');
            const textoTema     = document.getElementById('texto-tema');

            // Lê preferência salva; padrão é "dark"
            const temaInicial = localStorage.getItem(CHAVE_STORAGE) || 'dark';
            aplicarTema(temaInicial);

            // Evento de clique no botão
            btnTema.addEventListener('click', function () {
                const temaAtual = html.getAttribute('data-theme');
                const novoTema  = temaAtual === 'dark' ? 'light' : 'dark';
                aplicarTema(novoTema);
                localStorage.setItem(CHAVE_STORAGE, novoTema);
            });

            /**
             * Aplica o tema ao <html> e atualiza ícone + texto do botão.
             * @param {string} tema - "dark" ou "light"
             */
            function aplicarTema(tema) {
                html.setAttribute('data-theme', tema);

                if (tema === 'dark') {
                    // Mostrando dark → botão oferece trocar para claro
                    iconeTema.className = 'bi bi-sun';
                    textoTema.textContent = 'Claro';
                } else {
                    // Mostrando light → botão oferece trocar para escuro
                    iconeTema.className = 'bi bi-moon-stars';
                    textoTema.textContent = 'Escuro';
                }
            }
        })();

        /* ─────────────────────────────────────────────────────────
           TOOLTIPS DO BOOTSTRAP
           ─────────────────────────────────────────────────────────
           Inicializa todos os elementos com data-bs-toggle="tooltip".
           ───────────────────────────────────────────────────────── */
        document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) {
            new bootstrap.Tooltip(el);
        });
    </script>

</body>
</html>
